<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quasih um anuh dih nois meuh amohh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="shortcut icon" href="https://media.flaticon.com/dist/min/img/favicon.ico"><style>
:root{--bg:#faf6f0;--ink:#2a2420;--muted:#7a6f66;--accent:#9c3b4a;--card:#fff;--line:#eadfd3;--ser:"Playfair Display",Georgia,"Times New Roman",serif;--sans:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
--kh:clamp(1.75rem,min(8vw,6vh),2.2rem);--fs:clamp(.62rem,3.65vw,.78rem);--fs2:clamp(.5rem,2.6vw,.62rem);--fs3:clamp(.42rem,2vw,.5rem);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14100e;--ink:#f3ece4;--muted:#a89c92;--accent:#e58b98;--card:#1d1714;--line:#2e2520}}
:root[data-theme="dark"]{--bg:#14100e;--ink:#f3ece4;--muted:#a89c92;--accent:#e58b98;--card:#1d1714;--line:#2e2520}
@media(min-width:640px){:root{--kh:clamp(1.95rem,min(5.4vw,7vh),2.6rem);--fs:clamp(.7rem,2.05vw,.86rem);--fs2:clamp(.55rem,1.58vw,.68rem);--fs3:clamp(.48rem,1.12vw,.58rem)}}
@media(min-width:1024px){:root{--kh:clamp(2.15rem,min(4.15vw,7.5vh),2.95rem);--fs:.95rem;--fs2:.7rem;--fs3:.58rem}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow-x:hidden;-webkit-font-smoothing:antialiased}
.wrap{max-width:60rem;margin:0 auto;padding:0 1.25rem;min-height:100vh;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:center}
.hero{text-align:center;padding:clamp(1rem,5vh,4.5rem) 0 .5rem}
.eyebrow{font-size:.75rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:var(--ser);font-weight:700;font-size:clamp(1.9rem,min(8vw,7vh),4.6rem);line-height:1.05;margin:.6rem 0 .8rem;letter-spacing:-.01em}
h1 em{color:var(--accent);font-weight:500}
.lead{max-width:34rem;margin:0 auto;color:var(--muted);font-size:clamp(.85rem,min(2.6vw,2.3vh),1.12rem);line-height:1.5}
.stage{position:relative;width:100%;max-width:48rem;margin:clamp(.5rem,2vh,1.5rem) auto 0;padding:0 .25rem 1.5rem}
.typed{position:relative;z-index:2;min-height:2.6rem;margin:0 0 .6rem;text-align:center;font-family:var(--ser);font-style:italic;font-size:clamp(1.3rem,5vw,2.4rem);color:var(--ink)}
.typed::after{content:"";display:inline-block;width:2px;height:.95em;margin-left:4px;vertical-align:-.1em;background:var(--accent);animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
#fl{position:absolute;inset:0;pointer-events:none;z-index:1}
.fl{position:absolute;white-space:nowrap;font-family:var(--ser);font-style:italic;font-weight:500;color:var(--accent);text-shadow:0 1px 8px var(--bg);animation:up 4.4s ease-out forwards}
@keyframes up{0%{opacity:0;transform:translate(-50%,0) scale(.8)}12%{opacity:.95}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-230px) rotate(var(--r)) scale(1.1)}}
.persp{perspective:1800px;position:relative;z-index:2}
.board{position:relative;transform:rotateX(7deg);transform-origin:50% 100%}
.board::after{content:"";position:absolute;left:16%;right:16%;top:99%;height:4px;border-radius:9px;background:rgba(15,10,6,.25);filter:blur(2px)}
.case{position:relative;padding:1.3% 1.5%;border-radius:6px;background:linear-gradient(178deg,#ad7440,#9d6636 26%,#895128 55%,#764a24 78%,#63391a);box-shadow:inset 0 .5px 0 rgba(255,222,185,.3),inset 0 -2px 5px rgba(35,19,6,.32),0 3px 6px rgba(15,8,3,.22),0 14px 30px rgba(15,8,3,.18)}
.case::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--grain);mix-blend-mode:multiply;opacity:.5;pointer-events:none}
.bezel{position:relative;padding:.35%;border-radius:4px;background:linear-gradient(155deg,#15120e,#0a0805);box-shadow:inset 0 3px 7px rgba(0,0,0,.55),0 1px 0 rgba(255,236,204,.12)}
.rows{display:flex;flex-direction:column;gap:2px}
.row{display:flex;gap:2px}
@media(min-width:640px){.rows,.row{gap:2.5px}}@media(min-width:1024px){.rows,.row{gap:3px}}
.key{position:relative;flex-basis:0;min-width:0;height:var(--kh);padding:0;border:0;background:none;pointer-events:none;outline:none;transform:rotate(var(--t));transition:transform .26s cubic-bezier(.34,1.56,.64,1)}
.key.p{transform:translateY(4px) scale(.975) rotate(0);transition:transform 15ms linear}
.key::before{content:"";position:absolute;inset:0;border-radius:6px;background:linear-gradient(180deg,#f0e4d1,#e0cead 18%,#c8b394 46%,#a68e70 78%,#8c7458);box-shadow:0 1.5px 2px rgba(12,8,4,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.cap{position:absolute;inset:3px 4px 9px;border-radius:5px;background:radial-gradient(115% 125% at 23% 9%,rgba(255,255,255,.42),transparent 44%),#dfd2c3;box-shadow:inset 0 0 0 .75px rgba(96,70,42,.28),inset 0 .6px 0 rgba(255,250,238,.4);transition:filter .14s}
.key.p .cap{filter:brightness(.96)}
.cap b{position:absolute;bottom:14%;left:50%;transform:translateX(-50%);font:700 var(--fs)/1 var(--sans);color:#413e38;white-space:nowrap}
.key.sm .cap b{left:.8em;transform:none;font-size:var(--fs2);font-weight:600}
.cap u{position:absolute;top:13%;left:18%;text-decoration:none;font:500 var(--fs3)/1 var(--sans);color:#726d64;opacity:.7}
.rst{position:relative;z-index:2;display:block;margin:0 auto 1rem;padding:.35rem .9rem;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);font:600 .75rem var(--sans);letter-spacing:.04em;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .5s,border-color .2s,color .2s}
.rst.show{opacity:1;pointer-events:auto}
.rst:hover{border-color:var(--accent);color:var(--accent)}
.hint{text-align:center;color:var(--muted);font-size:.8rem;margin:1.8rem 0 0}
.sec{padding:5rem 0 1rem}
.sec h2{font-family:var(--ser);font-size:clamp(1.6rem,4.5vw,2.4rem);text-align:center;margin:0 0 2rem}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.6rem;text-align:center}
.num{font-family:var(--ser);font-size:3rem;font-weight:700;color:var(--accent);line-height:1}
.lbl{margin-top:.6rem;color:var(--muted);font-size:.9rem}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:1.1rem}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:9px;transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.end{text-align:center;padding:5rem 0 4rem}
.end p{font-family:var(--ser);font-style:italic;font-size:clamp(1.5rem,4.6vw,2.3rem);line-height:1.35;max-width:36rem;margin:0 auto}
.end small{display:block;margin-top:1.4rem;color:var(--muted);font-size:.9rem;letter-spacing:.04em}
@media(prefers-reduced-motion:reduce){.fl{animation-duration:2s}.key{transition:none}.typed::after{animation:none}}
@media(max-height:520px){:root{--kh:clamp(1.3rem,calc((100dvh - 9.5rem)/5.6),2.4rem)}.eyebrow,.lead{display:none}h1{font-size:clamp(1.3rem,7vh,2rem);margin:0 0 .3rem}h1 br{display:none}.hero{padding:.6rem 0 0}.typed{min-height:2rem;font-size:clamp(1.1rem,6vh,1.6rem);margin-bottom:.4rem}.stage{padding-bottom:.8rem}}
</style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <div class="eyebrow">Nadah vaih sepalah euh dih vuceh</div>
    <h1>Mim amah <br>vuceh <em>Muituh</em>.</h1>
    <p class="lead">Mim naum conseguih explessah uh quantuh mim adolah vuceh minha Docinhuh..</p>
  </section>

  <section class="stage" id="stage">
    <p class="typed" id="out" aria-label="Mensagens digitadas automaticamente"></p>
    <button class="rst" id="rst" type="button">↻ Recomeçar</button>
    <div id="fl"></div>
    <div class="persp"><div class="board"><div class="case"><div class="bezel"><div class="rows" id="kb"></div></div></div></div></div>
  </section>

</main>

<script>
// ===== Personalize aqui =====
const PHRASES = ["Euh tih amuh", "Toh semplih aquih", "Feliz diah pah noiss", "Minhah princesah"];
// ============================

const grainSvg = "<svg xmlns='http://www.w3.org/2000/svg' width='460' height='460'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.14 0.0032' numOctaves='5' seed='23' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.27 0 0 0 0 0.15 0 0 0 0 0.065 0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(#g)'/></svg>";
document.documentElement.style.setProperty('--grain', 'url("data:image/svg+xml;utf8,' + encodeURIComponent(grainSvg) + '")');

const L = s => [...s].map(c => [c, c.toUpperCase()]);
const M = (id, l) => [id, l, 0, 1.25, 1];
const ROWS = [
  [["esc","Esc",0,1,1], ...[..."1234567890"].map((c,i)=>[c,c,"!@#$%^&*()"[i]]), ["mn","-","_"], ["eq","=","+"], ["bksp","⌫",0,2,1]],
  [["tab","Tab",0,1.5,1], ...L("qwertyuiop"), ["lb","[","{"], ["rb","]","}"], ["bs","\\","|",1.5]],
  [["caps","Caps",0,1.75,1], ...L("asdfghjkl"), ["sc",";",":"], ["qt","'",'"'], ["enter","Enter",0,2.25,1]],
  [["lshift","Shift",0,2.25,1], ...L("zxcvbnm"), ["cm",",","<"], ["dt",".",">"], ["sl","/","?"], ["rshift","Shift",0,2.75,1]],
  [M("lctrl","Ctrl"), M("lwin","Win"), M("lalt","Alt"), ["space","",0,6.25], M("ralt","Alt"), M("rwin","Win"), M("fn","Fn")]
];

const keys = {}, kb = document.getElementById('kb');
let n = 0;
ROWS.forEach(r => {
  const row = document.createElement('div'); row.className = 'row';
  r.forEach(([id, l, s, w = 1, sm]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.tabIndex = -1; b.className = 'key' + (sm ? ' sm' : '');
    b.setAttribute('aria-label', l || 'Espaço');
    b.style.flexGrow = w;
    b.style.setProperty('--t', (Math.sin(++n * 12.9898) * .16) + 'deg');
    b.innerHTML = '<i class="cap">' + (s ? '<u>' + s + '</u>' : '') + (l ? '<b>' + l + '</b>' : '') + '</i>';
    keys[id] = b; row.appendChild(b);
  });
  kb.appendChild(row);
});

function press(id) { const k = keys[id]; if (k) k.classList.add('p'); }
function release(id) { const k = keys[id]; if (k) k.classList.remove('p'); }


// ---- palavras flutuantes ----
const stage = document.getElementById('stage'), fl = document.getElementById('fl'), out = document.getElementById('out');
function fly(t, id) {
  if (!t) return;
  const k = keys[id] || keys.space, s = stage.getBoundingClientRect(), r = k.getBoundingClientRect();
  const e = document.createElement('span'); e.className = 'fl'; e.textContent = t;
  e.style.left = (r.left - s.left + r.width / 2) + 'px';
  e.style.top = (r.top - s.top) + 'px';
  e.style.fontSize = (1.1 + Math.random() * .7) + 'rem';
  e.style.setProperty('--dx', (Math.random() * 140 - 70) + 'px');
  e.style.setProperty('--r', (Math.random() * 12 - 6) + 'deg');
  fl.appendChild(e); e.addEventListener('animationend', () => e.remove());
}

// ---- digitação automática ----
const sleep = ms => new Promise(r => setTimeout(r, ms));
const base = c => c.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const rst = document.getElementById('rst');
async function run() {
  out.textContent = ''; rst.classList.remove('show');
  await sleep(900);
  for (const p of PHRASES) {
    out.textContent = ''; let w = '', last = 'space';
    for (const ch of p) {
      const up = ch !== ch.toLowerCase(), id = ch === ' ' ? 'space' : base(ch);
      if (keys[id]) {
        if (up) { press('lshift'); await sleep(70); }
        press(id); out.textContent += ch; await sleep(90); release(id);
        if (up) release('lshift');
      } else out.textContent += ch;
      if (ch === ' ') { fly(w, last); w = ''; } else { w += ch; last = id; }
      await sleep(80 + Math.random() * 100);
    }
    fly(w, last);
    if (p === PHRASES[PHRASES.length - 1]) break;
    await sleep(1800);
    press('enter'); await sleep(110); release('enter');
    await sleep(600);
  }
  await sleep(700);
  rst.classList.add('show');
}
rst.onclick = run;
run();

</script>
</body>
</html>
